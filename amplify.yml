version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist/client
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
      renderMode: ssr # Add this line
      buildPath: "dist" # Add this line
      serverBuildPath: "../lambda.js" # Add this line
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=0, must-revalidate'
    build:
      appBuild: true
    buildSpec:
      artifacts:
        baseDirectory: frontend
        files:
          - '**/*'
      phases:
        build:
          commands:
            - cd frontend
            - npm install
            - npm run build
            - mkdir -p dist/client/.amplify-hosting
            - cp -r node_modules dist/
            - cp lambda.js dist/
            - cp server.js dist/
            - cp dist/client/index.html dist/client/.amplify-hosting/index.html || true
            - echo '{"renderMode":"ssr","entryPoint":"../lambda.js"}' > dist/client/.amplify-hosting/amplify.json
    backend:
      phases:
        build:
          commands:
            - echo "✅ Backend build is handled as part of frontend build"
    deploy:
      phases:
        preDeploy:
          commands:
            - echo "🚀 Preparing for deployment"
        deploy:
          commands:
            - npm run start:aws
        postDeploy:
          commands:
            - echo "✅ Deployment completed successfully!"
