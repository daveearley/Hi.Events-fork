version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
            - cp lambda.js dist/
            - cp server.js dist/
            - cp -r node_modules dist/
      artifacts:
        baseDirectory: dist/client
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
      renderMode: ssr
      buildPath: dist
      serverBuildPath: dist/lambda.js
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=0, must-revalidate'
    backend:
      phases:
        build:
          commands:
            - echo "✅ Backend build is handled as part of frontend build"
