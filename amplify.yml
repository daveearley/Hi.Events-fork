version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=0, must-revalidate'
    build:
      appBuild: true
    buildSpec:
      artifacts:
        baseDirectory: frontend
        files:
          - '**/*'
      phases:
        build:
          commands:
            - cd frontend
            - npm install
            - npm run build
            - cp -r node_modules dist/
            - cp lambda.js dist/
            - cp server.js dist/
            - cp index.html dist/ || true
    backend:
      phases:
        build:
          commands:
            - echo "✅ Backend build is handled as part of frontend build"
    deploy:
      phases:
        preDeploy:
          commands:
            - echo "🚀 Preparing for deployment"
        deploy:
          commands:
            - npm run start:aws
        postDeploy:
          commands:
            - echo "✅ Deployment completed successfully!"
