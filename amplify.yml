version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    backend:
      phases:
        preBuild:
          commands:
            - npm install -g @aws-amplify/cli
            - npm install
        build:
          commands:
            - amplify push --yes
        postBuild:
          commands:
            - echo "✅ Backend successfully deployed"
    deploy:
      phases:
        preDeploy:
          commands:
            - echo "🚀 Preparing for deployment"
        deploy:
          commands:
            - if [ "$AWS_EXECUTION_ENV" ]; then npm run start:aws; else npm run start; fi
        postDeploy:
          commands:
            - echo "✅ Deployment completed successfully!"
