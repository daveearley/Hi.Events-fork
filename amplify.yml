version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
            # Move the build output to Amplify's expected structure
            - mkdir -p .amplify-hosting/static .amplify-hosting/compute/default
            - cp -r dist/client/* .amplify-hosting/static
            - cp -r dist/server/* .amplify-hosting/compute/default
            - cp lambda.js .amplify-hosting/compute/default/server.js  # Rename if needed
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    backend:
      phases:
        preBuild:
          commands:
            - npm install -g @aws-amplify/cli
            - npm install
        build:
          commands:
            - echo "✅ No backend detected, skipping backend build"
        postBuild:
          commands:
            - echo "✅ Backend successfully deployed"
    deploy:
      phases:
        preDeploy:
          commands:
            - echo "🚀 Preparing for deployment"
        deploy:
          commands:
            - echo "Starting SSR Server..."
        postDeploy:
          commands:
            - echo "✅ Deployment completed successfully!"
